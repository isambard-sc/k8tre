apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8tre-tls
spec:
  secretName: k8tre-tls
  privateKey:
    rotationPolicy: Always
  commonName: base.k8tre.internal
  dnsNames:
    - base.k8tre.internal
    - dev.193-123-191-48.sslip.io
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer